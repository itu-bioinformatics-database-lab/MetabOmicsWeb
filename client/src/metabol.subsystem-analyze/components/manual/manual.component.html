<div class="upload-page">
  <div class="header">
    <h2>Manual Data Entry</h2>
  </div>

  <div>
    <concentration-table 
      [mConTable]="mConTable"
      [currentOmics]="'Metabolomics'">
    </concentration-table>
  </div>

  <div class="actions">
    <div class="left">
      <button class="btn btn-default" (click)="onBackClick()">Back</button>
    </div>
    <div class="right" *ngIf="canProceed()">
      <button class="btn btn-primary" (click)="onContinue()">
        {{ getContinueButtonText() }}
      </button>
    </div>
  </div>
</div>
