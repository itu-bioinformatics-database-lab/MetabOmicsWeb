<div class="upload-page">
  <div class="header">
    <h2>Sample Data – {{ currentOmicsType }}</h2>
  </div>

  <!-- No sample file available for this omics type -->
  <div *ngIf="!hasSampleFile" class="no-sample-notice">
    <span class="notice-icon">ℹ️</span>
    <div class="notice-body">
      <h3>No Sample Data Available</h3>
      <p>There is no built-in sample dataset for <strong>{{ currentOmicsType }}</strong>.<br>
         Please go back and choose one of the options below:</p>
      <div class="options-hint">
        <a [routerLink]="['/analyze/' + currentOmicsType.toLowerCase().replace(' ', '-')]" class="hint-chip">
          <i class="fas fa-upload"></i> Upload File
        </a>
        <a [routerLink]="['/analyze/manual']" class="hint-chip">
          <i class="fas fa-edit"></i> Manual Entry
        </a>
      </div>
    </div>
  </div>

  <!-- Sample data table -->
  <div *ngIf="hasSampleFile && mConTable && mConTable.length > 0">
    <concentration-table
      [mConTable]="currentOmicsType === 'Metabolomics' ? mConTable : null"
      [tConTable]="currentOmicsType === 'Transcriptomics' ? mConTable : null"
      [currentOmics]="currentOmicsType">
    </concentration-table>
  </div>

  <!-- Loading spinner -->
  <div *ngIf="hasSampleFile && loading && isCurrentTableEmpty">
    <mat-spinner diameter="50" style="margin:30px auto 10px auto;"></mat-spinner>
    <div style="text-align: center; color: #7f8c8d; margin-top: 8px;">
      Loading sample {{ currentOmicsType }} data. Please wait...
    </div>
  </div>

  <div class="actions">
    <div class="left">
      <button class="btn btn-default" (click)="onBackClick()">← Back</button>
    </div>
    <div class="right" *ngIf="canProceed()">
      <button class="btn btn-primary" (click)="onContinue()">
        {{ getContinueButtonText() }}
      </button>
    </div>
  </div>
</div>
